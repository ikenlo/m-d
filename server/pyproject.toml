[project]
name = "mds-connect"
version = "0.1.32"
description = "MDS Connect — внутрішня система салону M&D (записи, зарплати, фінанси, Telegram-бот)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "PyJWT>=2.8",
  "aiogram>=3.10,<4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mds*"]

[tool.setuptools.package-data]
mds = ["web/static/*", "seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
