name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check mds tests
      - name: JS syntax
        run: |
          node --check mds/web/static/app.js
      - name: Tests
        run: python -m pytest

  ui:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r server/requirements-dev.txt
      - name: Playwright
        working-directory: ui-tests
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Демо-база і сервер
        env:
          MDS_ENV: test
          MDS_DATA_DIR: ${{ runner.temp }}/mds-ui
          MDS_PORT: "8770"
          MDS_CHECKBOX_API_URL: http://127.0.0.1:8779
          MDS_CHECKBOX_LOGIN: ci-cashier
          MDS_CHECKBOX_PASSWORD: ci-not-a-secret
          MDS_CHECKBOX_LICENSE_KEY: ci-not-a-secret
        run: |
          ./ui-tests/seed.sh
          cd server && nohup python -m mds serve > ${{ runner.temp }}/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8770/api/health && break; sleep 1; done
      - name: Перевірка сторінок
        run: node ui-tests/smoke.js http://localhost:8770
      - name: Оплата карткою (ручний режим і макет POS-термінала)
        run: node ui-tests/terminal.js http://localhost:8770
      - name: E2E з емулятором POS-термінала
        run: node ui-tests/e2e_fake_terminal.js http://localhost:8770
      - name: Checkbox (ПРРО) — чек і друк через макет
        run: node ui-tests/checkbox.js http://localhost:8770
      - name: Друк чеків — емулятори Checkbox і принтера ESC/POS
        run: node ui-tests/receipt_e2e.js http://localhost:8770
      - name: Знімки екранів
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-tests/out
          retention-days: 7
      - name: Журнал сервера
        if: failure()
        run: tail -100 ${{ runner.temp }}/serve.log
